name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the released commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_SHA on a release event is the tagged commit. "behind" or
          # "identical" means it is reachable from main.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status) || status="error"
          case "$status" in
            identical|behind) echo "$GITHUB_SHA is on main ($status)" ;;
            *) echo "::error::Release commit $GITHUB_SHA is not on main (compare status: $status); refusing to release."; exit 1 ;;
          esac

  publish:
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
