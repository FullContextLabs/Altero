# Opens a PR on FullContextLabs/homebrew-tap that updates version and sha256 of
# Casks/altero.rb when a release is published (the tap's main takes no direct
# pushes). Needs the secret HOMEBREW_TAP_TOKEN: a fine-grained PAT scoped to
# FullContextLabs/homebrew-tap only, with Contents read/write and Pull requests
# read/write. The owner merges the PR.
name: Update Homebrew cask

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG and compute sha256
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v="${TAG#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected tag: $TAG" >&2; exit 1; }
          # The asset may not be attached yet when the release event fires.
          for i in 1 2 3 4 5 6; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Altero-$v.dmg" && break
            [ "$i" = 6 ] && { echo "Altero-$v.dmg not found on $TAG" >&2; exit 1; }
            sleep 20
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "Altero-$v.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FullContextLabs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.dmg.outputs.version }}
          SHA: ${{ steps.dmg.outputs.sha }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version: $VERSION" >&2; exit 1; }
          sed -i -E "s/^(  version \").*(\")/\1$VERSION\2/; s/^(  sha256 \").*(\")/\1$SHA\2/" Casks/altero.rb
          if git diff --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          branch="bump-altero-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "altero $VERSION"
          # A rerun rebuilds the same commit; overwrite this bump branch only.
          git push --force origin "$branch"
          if [ -n "$(gh pr list -R FullContextLabs/homebrew-tap --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $branch already open"
            exit 0
          fi
          gh pr create -R FullContextLabs/homebrew-tap --base main --head "$branch" \
            --title "altero $VERSION" --body "Bump the cask to $VERSION (from the release workflow in FullContextLabs/Altero)."
